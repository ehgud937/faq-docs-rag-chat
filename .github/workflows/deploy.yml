name: Deploy to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        script: |
          cd ~/faq-docs-rag-chat
          
          # 최신 코드 가져오기
          git pull origin master
          
          # 기존 컨테이너 중지 및 삭제
          docker stop faq-chat || true
          docker rm faq-chat || true
          
          # 이전 이미지 삭제
          docker rmi faq-rag-chat || true
          
          # 새 이미지 빌드
          docker build --no-cache -t faq-rag-chat .
          
          # 컨테이너 실행
          docker run -d \
            -p 8000:8000 \
            --env-file .env \
            -v ~/faq-docs-rag-chat/data:/app/data \
            --name faq-chat \
            --restart unless-stopped \
            faq-rag-chat
          
          # 사용하지 않는 이미지 정리
          docker image prune -f
          
          # 실행 확인
          sleep 5
          docker ps | grep faq-chat
          echo "✅ Deployment completed!"