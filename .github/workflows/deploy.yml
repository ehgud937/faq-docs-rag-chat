name: Deploy to EC2

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        command_timeout: 30m
        script: |
          cd ~/faq-docs-rag-chat
          git pull origin master
          
          # 변경 파일 확인
          CHANGED_FILES=$(git diff HEAD@{1} --name-only)
          
          # Dockerfile이나 requirements.txt 변경 시에만 재빌드
          if echo "$CHANGED_FILES" | grep -qE "requirements.txt|Dockerfile"; then
            echo "📦 Dependencies changed - full rebuild"
            docker stop faq-chat || true
            docker rm faq-chat || true
            docker rmi faq-rag-chat || true
            docker build -t faq-rag-chat .
          else
            echo "♻️ Code only changed - quick rebuild with cache"
            docker stop faq-chat || true
            docker rm faq-chat || true
            docker build -t faq-rag-chat .  # 캐시 사용!
          fi
          
          # 컨테이너 실행
          docker run -d \
            -p 8000:8000 \
            --env-file .env \
            -v ~/faq-docs-rag-chat/data:/app/data \
            --name faq-chat \
            --restart unless-stopped \
            faq-rag-chat
          
          docker image prune -f
          sleep 5
          docker ps | grep faq-chat
          echo "✅ Deployment completed!"